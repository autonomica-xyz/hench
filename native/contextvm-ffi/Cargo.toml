[package]
name = "contextvm-ffi"
version = "0.2.0"
edition = "2021"
description = "FFI bindings for the ContextVM SDK — C header + Python/Swift/Kotlin support"
license = "MIT"

[lib]
name = "contextvm_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
contextvm-sdk = { path = "../contextvm-sdk" }
nostr-sdk = "0.45"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uniffi = "0.31"
parking_lot = "0.12"
async-trait = "0.1"

[dev-dependencies]
contextvm-sdk = { path = "../contextvm-sdk", features = ["test-utils"] }
tokio = { version = "1", features = ["test-util"] }

[features]
default = []
