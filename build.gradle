plugins {
    // AGP 9 provides built-in Kotlin support — do not apply
    // org.jetbrains.kotlin.android separately.
    id 'com.android.application' version '9.4.1'
    // Kotlinx serialization compiler plugin; version must match the Kotlin
    // Gradle plugin (built-in Kotlin runtime, auto-upgraded to 2.4.21 here).
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21'
}

def appVersionName = "0.1.0"

// The old `base { archivesName }` block is gone: AGP 9 does not register the
// `base` extension, and archive naming never affected the APK name anyway.

def loadBundledBreezApiKey = {
    def bundledKeyFile = rootProject.file('breez.txt')
    if (!bundledKeyFile.exists()) {
        throw new GradleException("Missing breez.txt at repository root; hench APK requires a bundled Breez Spark API key")
    }

    def line = bundledKeyFile.readLines()
            .collect { it.trim() }
            .find { !it.isEmpty() && !it.startsWith('#') }
    if (line == null || line.isEmpty()) {
        throw new GradleException("breez.txt is empty; hench APK requires a bundled Breez Spark API key")
    }

    if (line.startsWith('BREEZ_API_KEY=')) {
        line = line.substring('BREEZ_API_KEY='.length()).trim()
    }
    if ((line.startsWith('"') && line.endsWith('"')) || (line.startsWith("'") && line.endsWith("'"))) {
        line = line.substring(1, line.length() - 1).trim()
    }
    if (line.isEmpty()) {
        throw new GradleException("breez.txt did not contain a usable Breez Spark API key")
    }
    return line
}

def quoteBuildConfigString = { value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace = 'net.nostr.hench'
    compileSdk = 37
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId = "net.nostr.hench"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Both native runtimes include these ABIs; curl_cffi impersonation
        // is arm64-only because its Android build targets arm64-v8a.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        buildConfigField "String", "BREEZ_SPARK_API_KEY", quoteBuildConfigString(loadBundledBreezApiKey())
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
            debuggable = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility
    // (17), so no kotlin.compilerOptions block is needed.

    packaging {
        jniLibs {
            // YoutubeDL library initializes Python/FFmpeg by reading .zip.so files
            // from nativeLibraryDir (not assets). Keep them extracted to disk.
            useLegacyPackaging = true
            keepDebugSymbols += [
                    '**/libbreez_sdk_spark_bindings.so',
                    '**/libcontextvm_ffi.so',
                    '**/libffmpeg.so',
                    '**/libffmpeg.zip.so',
                    '**/libffprobe.so',
                    '**/libjnidispatch.so',
                    '**/libpython.so',
                    '**/libpython.zip.so',
                    '**/libqjs.so',
            ]
        }
    }

    lint {
        disable 'MissingTranslation', 'SetTextI18n'
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"

    implementation "androidx.core:core-ktx:1.19.1"
    implementation "androidx.webkit:webkit:1.17.1"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"

    // UniFFI Kotlin binding for libcontextvm_ffi (generated, uses JNA).
    implementation "net.java.dev.jna:jna:5.19.1@aar"
    implementation files("libs/hench-spark-bindings.aar")
    implementation "org.jetbrains.kotlinx:atomicfu:0.33.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"

    // Rebuilt native payloads; recipes and source pins live in native-*/.
    implementation files("libs/hench-python-runtime.aar")
    implementation files("libs/hench-ffmpeg-runtime.aar")
    implementation "io.github.junkfood02.youtubedl-android:common:0.18.1"

    // Local AARs do not carry POM dependencies; keep the wrappers' JVM
    // dependencies explicit instead of restoring their vulnerable old pins.
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.4"
    implementation "commons-io:commons-io:2.22.0"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "org.tukaani:xz:1.12"
    implementation "com.github.luben:zstd-jni:1.5.7-23@aar"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}

// NOTE: The old extractBundledPackageAssets task that copied .zip.so files into
// assets/bundled/ was removed. The youtubedl-android library reads .zip.so directly
// from nativeLibraryDir (context.applicationInfo.nativeLibraryDir) — verified by
// decompiling initPython/initFFmpeg in YoutubeDL.class and FFmpeg.class.
// The assets/bundled/ copies were pure duplication (~55MB wasted).
